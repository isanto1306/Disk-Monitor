name: Publish Beta Docker image

on:
  push:
    branches:
      - beta
    paths-ignore:
      - 'README.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Check out beta branch
        uses: actions/checkout@v4

      - name: Read beta version
        id: app_version
        shell: bash
        run: |
          version="$(sed -n 's/^  version: "\([^"]*\)"/\1/p' docker-compose.beta.yml | head -n1)"
          if [ -z "$version" ]; then
            echo "Could not read Beta version from docker-compose.beta.yml" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Publishing Disk Monitor Beta version $version"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/disk-monitor
          tags: |
            type=raw,value=beta
            type=raw,value=${{ steps.app_version.outputs.version }}
            type=sha,prefix=beta-sha-

      - name: Build and push Beta image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.beta
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          cache-from: type=gha,scope=disk-monitor-beta
          cache-to: type=gha,mode=max,scope=disk-monitor-beta
