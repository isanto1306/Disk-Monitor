name: Branch syntax check

on:
  push:
    branches:
      - standby-fixes-0.32.100

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Python sources
        run: |
          python -m py_compile \
            app/main.py \
            app/entrypoint.py \
            app/entrypoint_header_stable.py \
            app/email_notifications.py
