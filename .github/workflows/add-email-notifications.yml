name: Add Disk Monitor email notifications

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-email-notifications.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply email notification feature
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, zlib

          backend_z = ""
          frontend_z = ""

          Path('app/email_notifications.py').write_bytes(zlib.decompress(base64.b64decode(backend_z)))
          Path('static/email-notifications.js').write_bytes(zlib.decompress(base64.b64decode(frontend_z)))

          p = Path('app/entrypoint_header_stable.py')
          s = p.read_text(encoding='utf-8')
          assert 'import entrypoint\n' in s
          if 'import email_notifications\n' not in s:
              s = s.replace('import entrypoint\n', 'import entrypoint\nimport email_notifications\n', 1)
          assert 'app.version = "0.22.35"' in s
          assert 'entrypoint.main.app.version = "0.22.35"' in s
          s = s.replace('app.version = "0.22.35"', 'app.version = "0.22.36"', 1)
          s = s.replace('entrypoint.main.app.version = "0.22.35"', 'entrypoint.main.app.version = "0.22.36"', 1)
          install_anchor = 'entrypoint.main.app.version = "0.22.36"\n'
          if 'email_notifications.install(app, entrypoint.main)' not in s:
              s = s.replace(install_anchor, install_anchor + '\nemail_notifications.install(app, entrypoint.main)\n', 1)
          html_anchor = 'if entrypoint._index_html is not None:\n'
          assert html_anchor in s
          inject = '''if entrypoint._index_html is not None:\n    entrypoint._index_html = entrypoint._index_html.replace(\n        '"v0.32.86"',\n        '"v0.32.87"',\n        1,\n    )\n\n    if 'email-notifications.js?v=0.32.87' not in entrypoint._index_html:\n        entrypoint._index_html = entrypoint._index_html.replace(\n            '</body>',\n            '<script src="/email-notifications.js?v=0.32.87"></script>\\n</body>',\n            1,\n        )\n'''
          s = s.replace(html_anchor, inject, 1)
          p.write_text(s, encoding='utf-8')

          for name in ('docker-compose.yml', 'docker-compose.zimaos.yml'):
              p = Path(name)
              s = p.read_text(encoding='utf-8')
              assert 'version: "0.32.86"' in s, name
              assert 'update_at: "2026-09-17"' in s, name
              s = s.replace('version: "0.32.86"', 'version: "0.32.87"', 1)
              s = s.replace('update_at: "2026-09-17"', 'update_at: "2026-09-20"', 1)
              p.write_text(s, encoding='utf-8')

          p = Path('README.md')
          s = p.read_text(encoding='utf-8')
          assert '- Backend: ' + chr(96) + '0.22.35' + chr(96) in s
          assert '- Frontend: ' + chr(96) + '0.32.86' + chr(96) in s
          s = s.replace('- Backend: ' + chr(96) + '0.22.35' + chr(96), '- Backend: ' + chr(96) + '0.22.36' + chr(96), 1)
          s = s.replace('- Frontend: ' + chr(96) + '0.32.86' + chr(96), '- Frontend: ' + chr(96) + '0.32.87' + chr(96), 1)
          feature_anchor = '- Normal automatic SMART checks avoid waking sleeping HDDs\n'
          assert feature_anchor in s
          if 'Configurable SMTP email alerts' not in s:
              s = s.replace(feature_anchor, feature_anchor + '- Configurable SMTP email alerts for SMART, drive disappearance, RAID and temperature events with an independent notification language\n- Email alert monitoring follows the existing no-wake policy and does not wake sleeping HDDs just to send notifications\n', 1)
          security_anchor = '- host logs containing private paths or machine-specific information\n'
          assert security_anchor in s
          if 'SMTP credentials stored in the persistent cache' not in s:
              s = s.replace(security_anchor, security_anchor + '- SMTP credentials stored in the persistent cache when email notifications are configured\n', 1)
          p.write_text(s, encoding='utf-8')

          helper = Path('.github/workflows/add-email-notifications.yml')
          if helper.exists():
              helper.unlink()
          PY

          python3 -m py_compile app/email_notifications.py app/entrypoint_header_stable.py
          node --check static/email-notifications.js

          grep -q '0.32.87' docker-compose.yml
          grep -q '0.32.87' docker-compose.zimaos.yml
          grep -q '0.22.36' app/entrypoint_header_stable.py
          grep -q 'email_notifications.install' app/entrypoint_header_stable.py

      - name: Commit feature
        shell: bash
        run: |
          git config user.name "isanto1306"
          git config user.email "185259594+isanto1306@users.noreply.github.com"
          git add -A
          git commit -m "Disk Monitor 0.32.87 - add email notifications"
          git push origin main
