name: Fix current status translations v0.32.85

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fix-current-status-v0.32.85.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update status translations and frontend version
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('static/index.html')
          text = path.read_text(encoding='utf-8')

          replacements = {
              '"STROMZUSTAND"': '"Aktueller Status"',
              '"POWER"': '"Current Status"',
          }

          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one {old!r}, found {count}')
              text = text.replace(old, new, 1)

          # The three translations below were already corrected in v0.32.84.
          for expected in (
              '"power": "État actuel"',
              '"power": "Estado atual"',
              '"power": "Estado actual"',
          ):
              count = text.count(expected)
              if count != 1:
                  raise SystemExit(f'Expected exactly one {expected!r}, found {count}')

          # Update only the two live version locations, not historical comments.
          text, n1 = re.subn(
              r'(id="systemInfoVersion"\s*>\s*)v0\.32\.84',
              r'\1v0.32.85',
              text,
              count=1,
          )
          if n1 != 1:
              raise SystemExit(f'Expected one systemInfoVersion v0.32.84, changed {n1}')

          text, n2 = re.subn(
              r'(const\s+DISK_MONITOR_VERSION\s*=\s*["\'])v0\.32\.84(["\'])',
              r'\1v0.32.85\2',
              text,
              count=1,
          )
          if n2 != 1:
              raise SystemExit(f'Expected one DISK_MONITOR_VERSION v0.32.84, changed {n2}')

          path.write_text(text, encoding='utf-8')
          PY

      - name: JavaScript syntax test
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          text = Path('static/index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script([^>]*)>(.*?)</script>', text, flags=re.S | re.I)
          if not scripts:
              raise SystemExit('No script blocks found')
          for i, (_, body) in enumerate(scripts):
              Path(f'/tmp/dm-script-{i}.js').write_text(body, encoding='utf-8')
          PY
          for f in /tmp/dm-script-*.js; do
            node --check "$f"
          done

      - name: Validate exact changes
        shell: bash
        run: |
          grep -q 'Aktueller Status' static/index.html
          grep -q 'Current Status' static/index.html
          grep -q '"power": "État actuel"' static/index.html
          grep -q '"power": "Estado atual"' static/index.html
          grep -q '"power": "Estado actual"' static/index.html
          ! grep -q '"STROMZUSTAND"' static/index.html
          ! grep -q '"POWER"' static/index.html
          grep -q 'v0.32.85' static/index.html
          git diff --check
          test "$(git diff --name-only)" = "static/index.html"

      - name: Remove helper workflow and commit
        shell: bash
        run: |
          rm -f .github/workflows/fix-current-status-v0.32.85.yml
          git config user.name "isanto1306"
          git config user.email "185259594+isanto1306@users.noreply.github.com"
          git add static/index.html .github/workflows/fix-current-status-v0.32.85.yml
          git commit -m "Disk Monitor v0.32.85 – Update current status translations"
          git push origin HEAD:main
