name: Release Disk Monitor v0.32.83

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/release-v0.32.83.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply tested frontend v0.32.83
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/release_v83.py
          python3 /tmp/release_v83.py

      - name: JavaScript syntax test
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          text = Path('static/index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script([^>]*)>(.*?)</script>', text, flags=re.S | re.I)
          if not scripts:
              raise SystemExit('No script blocks found')
          for i, (_, body) in enumerate(scripts):
              Path(f'/tmp/dm-script-{i}.js').write_text(body, encoding='utf-8')
          print(f'Extracted {len(scripts)} script blocks')
          PY
          for f in /tmp/dm-script-*.js; do
            node --check "$f"
          done

      - name: Validate tested scope
        shell: bash
        run: |
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          expected = {'README.md','docker-compose.zimaos.yml','static/index.html'}
          import subprocess
          changed = set(subprocess.check_output(['git','diff','--name-only'], text=True).splitlines())
          if changed != expected:
              raise SystemExit(f'Unexpected changed files: {changed}')
          text = Path('static/index.html').read_text(encoding='utf-8')
          required = ['v0.32.83','id="freeCapacity"','function hasLiveRefreshHoveredControl','dm-unified-modal-close-v03281','smart-history-hit-point','translations[state.language]?.[metricKey]']
          for marker in required:
              if marker not in text:
                  raise SystemExit(f'Missing marker: {marker}')
          if 'settingsPanelClose' in text or 'settings-panel-close' in text:
              raise SystemExit('Settings X unexpectedly present')
          if '- Frontend: `0.32.83`' not in Path('README.md').read_text(encoding='utf-8'):
              raise SystemExit('README version missing')
          if 'version: "0.32.83"' not in Path('docker-compose.zimaos.yml').read_text(encoding='utf-8'):
              raise SystemExit('Compose version missing')
          PY

      - name: Remove one-time workflow and commit
        shell: bash
        run: |
          rm -f .github/workflows/release-v0.32.83.yml
          git config user.name "isanto1306"
          git config user.email "185259594+isanto1306@users.noreply.github.com"
          git add static/index.html README.md docker-compose.zimaos.yml .github/workflows/release-v0.32.83.yml
          git commit -m "Disk Monitor v0.32.83 – Stabilize hover and show free capacity"
          git push origin HEAD:main
