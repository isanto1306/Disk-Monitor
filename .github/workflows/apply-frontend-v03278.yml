name: Apply Disk Monitor frontend v0.32.78

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-frontend-v03278.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Apply exact v0.32.78 frontend patch
        shell: bash
        run: |
          python3 - <<'PY2'
          from pathlib import Path
          import base64, hashlib

          path = Path('static/index.html')
          data = path.read_text()

          css = base64.b64decode('').decode()
          js = base64.b64decode('').decode()

          expected_old_blob = 'dda44a99bbed59cba0f1a79c9127b1c3a48b4bde'
          raw = path.read_bytes()
          old_blob = hashlib.sha1(f'blob {len(raw)}\0'.encode() + raw).hexdigest()
          if old_blob != expected_old_blob:
              raise SystemExit(f'Unexpected current static/index.html blob: {old_blob}')

          if data.count('            v0.32.77') != 1:
              raise SystemExit('Expected visible v0.32.77 marker exactly once')
          if data.count('        "v0.32.77";') != 1:
              raise SystemExit('Expected DISK_MONITOR_VERSION v0.32.77 marker exactly once')
          if 'dm-page-scrollbar-v03278' in data or 'umPageScrollbarV21' in data:
              raise SystemExit('v0.32.78 scrollbar patch already present')

          data = data.replace('</style>\n</head>', '</style>\n' + css + '\n</head>', 1)
          data = data.replace('            v0.32.77', '            v0.32.78', 1)
          data = data.replace('        "v0.32.77";', '        "v0.32.78";', 1)
          data = data.replace('</script>\n\n</body>\n</html>', '</script>\n\n' + js + '\n</body>\n</html>', 1)

          encoded = data.encode()
          sha256 = hashlib.sha256(encoded).hexdigest()
          expected_sha256 = '64ea814c393d29f3c52897e5fc053ed0cb50c0344c25f36fb57077d99bde9e95'
          if sha256 != expected_sha256:
              raise SystemExit(f'Patched file SHA256 mismatch: {sha256}')

          path.write_bytes(encoded)
          print('static/index.html matches uploaded v0.32.78 exactly')
          PY2

      - name: Commit frontend update and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/apply-frontend-v03278.yml
          git add static/index.html .github/workflows/apply-frontend-v03278.yml
          git commit -m "Update Disk Monitor frontend to v0.32.78"
          git push
