name: Fix power state translations v0.32.84

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fix-power-state-translations-v0.32.84.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Correct translations only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('static/index.html')
          text = path.read_text(encoding='utf-8')

          replacements = {
              '"power": "ALIMENTATION"': '"power": "État actuel"',
              '"power": "ALIMENTAÇÃO"': '"power": "Estado atual"',
              '"power": "ALIMENTACIÓN"': '"power": "Estado actual"',
          }

          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one {old!r}, found {count}')
              text = text.replace(old, new, 1)

          if 'v0.32.84' not in text:
              raise SystemExit('Frontend version v0.32.84 not found')

          path.write_text(text, encoding='utf-8')
          PY

      - name: JavaScript syntax test
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          text = Path('static/index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script([^>]*)>(.*?)</script>', text, flags=re.S | re.I)
          if not scripts:
              raise SystemExit('No script blocks found')
          for i, (_, body) in enumerate(scripts):
              Path(f'/tmp/dm-script-{i}.js').write_text(body, encoding='utf-8')
          PY
          for f in /tmp/dm-script-*.js; do
            node --check "$f"
          done

      - name: Validate exact translation changes
        shell: bash
        run: |
          grep -q '"power": "État actuel"' static/index.html
          grep -q '"power": "Estado atual"' static/index.html
          grep -q '"power": "Estado actual"' static/index.html
          ! grep -q '"power": "ALIMENTATION"' static/index.html
          ! grep -q '"power": "ALIMENTAÇÃO"' static/index.html
          ! grep -q '"power": "ALIMENTACIÓN"' static/index.html
          git diff --check
          test "$(git diff --name-only)" = "static/index.html"

      - name: Remove helper workflow and commit
        shell: bash
        run: |
          rm -f .github/workflows/fix-power-state-translations-v0.32.84.yml
          git config user.name "isanto1306"
          git config user.email "185259594+isanto1306@users.noreply.github.com"
          git add static/index.html .github/workflows/fix-power-state-translations-v0.32.84.yml
          git commit -m "Disk Monitor v0.32.84 – Correct power state translations"
          git push origin HEAD:main
