name: disk-monitor-beta

services:
  disk-monitor-beta:
    container_name: disk-monitor-beta
    hostname: disk-monitor-beta
    image: ghcr.io/isanto1306/disk-monitor:beta
    restart: unless-stopped
    init: true

    labels:
      icon: https://raw.githubusercontent.com/isanto1306/Disk-Monitor/main/static/web-app-icon-512.png

    # Beta runs separately from Stable. Stable remains on 8999.
    network_mode: host

    # Required by the current hardware-integration design for SMART and
    # explicit standby commands.
    privileged: true

    environment:
      DISK_MONITOR_USERNAME: "CHANGE_ME_USERNAME"
      DISK_MONITOR_PASSWORD: "CHANGE_ME_PASSWORD_AT_LEAST_12_CHARS"
      DISK_MONITOR_SESSION_SECRET: "CHANGE_ME_SESSION_SECRET_AT_LEAST_32_CHARS"
      DISK_MONITOR_SESSION_HTTPS_ONLY: "false"
      DISK_MONITOR_PORT: "9010"

    volumes:
      - type: bind
        source: /sys
        target: /host/sys
        read_only: true
      - type: bind
        source: /proc
        target: /host/proc
        read_only: true
      - type: bind
        source: /dev
        target: /dev
      - type: bind
        source: /DATA/AppData/disk-monitor-beta/cache
        target: /app/cache

    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    stop_grace_period: 15s

    x-casaos:
      envs:
        - container: DISK_MONITOR_USERNAME
          description:
            en_US: Disk Monitor Beta login username. Change before installation.
            de_DE: Benutzername für Disk Monitor Beta. Vor der Installation ändern.
        - container: DISK_MONITOR_PASSWORD
          description:
            en_US: Disk Monitor Beta login password (at least 12 characters). Change before installation.
            de_DE: Passwort für Disk Monitor Beta (mindestens 12 Zeichen). Vor der Installation ändern.
        - container: DISK_MONITOR_SESSION_SECRET
          description:
            en_US: Private session secret (at least 32 characters). Generate a unique random value before installation.
            de_DE: Privates Session-Geheimnis (mindestens 32 Zeichen). Vor der Installation einen eindeutigen Zufallswert eintragen.
        - container: DISK_MONITOR_SESSION_HTTPS_ONLY
          description:
            en_US: Set to true only when Disk Monitor Beta is served exclusively over HTTPS.
            de_DE: Nur auf true setzen, wenn Disk Monitor Beta ausschließlich über HTTPS bereitgestellt wird.
        - container: DISK_MONITOR_PORT
          description:
            en_US: Internal host-network port for the Beta instance.
            de_DE: Port der Beta-Instanz im Host-Netzwerk.
      volumes:
        - container: /app/cache
          description:
            en_US: Separate Beta AppData cache.
            de_DE: Separater AppData-Cache für die Beta-Version.

x-casaos:
  id: com.isanto1306.disk-monitor-beta
  store_app_id: disk-monitor-beta
  main: disk-monitor-beta
  index: /
  port_map: "9010"
  scheme: http
  icon: https://raw.githubusercontent.com/isanto1306/Disk-Monitor/main/static/web-app-icon-512.png
  title:
    en_US: Disk Monitor Beta
    de_DE: Disk Monitor Beta
  tagline:
    en_US: Test build of Disk Monitor
    de_DE: Testversion von Disk Monitor
  description:
    en_US: Separate Beta instance for testing Disk Monitor changes without replacing the Stable installation.
    de_DE: Separate Beta-Instanz zum Testen von Disk-Monitor-Änderungen, ohne die stabile Installation zu ersetzen.
  author: isanto1306
  developer: isanto1306
  category: Utilities
  architectures:
    - amd64
  version: "0.32.104-beta.1"
  update_at: "2026-10-24"
  repo: https://github.com/isanto1306/Disk-Monitor/tree/beta
  support: https://github.com/isanto1306/Disk-Monitor/issues
  docs: https://github.com/isanto1306/Disk-Monitor/tree/beta#readme
